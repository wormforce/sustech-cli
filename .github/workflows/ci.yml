name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Refresh Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux Secret Service client
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsecret-tools
      - run: npm ci
      - name: Verify Linux Secret Service client loads
        if: runner.os == 'Linux'
        run: command -v secret-tool
      - run: npm run check
      - run: npm test
      - name: Exercise native credential storage
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: node scripts/ci-keyring-smoke.mjs
      - run: npm pack --dry-run
